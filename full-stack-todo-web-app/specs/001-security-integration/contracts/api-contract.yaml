# API Contracts: Security Integration (Better Auth + FastAPI JWT Bridge)

## OpenAPI Specification for Protected Endpoints

```yaml
openapi: 3.0.3
info:
  title: Todo API with JWT Authentication
  description: Secure todo management API with JWT-based user isolation
  version: 1.0.0
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from Better Auth authentication

  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          description: Unique task identifier
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description
        completed:
          type: boolean
          description: Task completion status
        user_id:
          type: string
          description: Owner user identifier
      required:
        - id
        - title
        - completed
        - user_id

    TaskInput:
      type: object
      properties:
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description
      required:
        - title

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Error message
      required:
        - detail

paths:
  /api/{user_id}/tasks:
    get:
      summary: List all tasks for authenticated user
      description: Retrieve all tasks owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier (must match JWT token)
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - JWT token user does not match URL user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new task for authenticated user
      description: Create a new task owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier (must match JWT token)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - JWT token user does not match URL user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/{user_id}/tasks/{id}:
    get:
      summary: Get task details
      description: Retrieve details of a specific task owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier (must match JWT token)
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Task identifier
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - JWT token user does not match URL user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a task
      description: Update details of a specific task owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier (must match JWT token)
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Task identifier
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - JWT token user does not match URL user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a task
      description: Delete a specific task owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier (must match JWT token)
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Task identifier
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted successfully
        '401':
          description: Unauthorized - Invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - JWT token user does not match URL user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/{user_id}/tasks/{id}/complete:
    patch:
      summary: Toggle task completion
      description: Toggle the completion status of a specific task owned by the authenticated user
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier (must match JWT token)
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Task identifier
          schema:
            type: integer
      responses:
        '200':
          description: Task completion toggled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - JWT token user does not match URL user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
```

## Security Requirements

1. **JWT Bearer Token**: All endpoints require a valid JWT token in the Authorization header
2. **User ID Verification**: The user_id in the URL path must match the user_id in the JWT token
3. **Error Handling**: Return 401 for invalid/missing tokens, 403 for user ID mismatches
4. **Statelessness**: Authentication must not require database lookups for each request