[alembic]
# path to migration scripts
script_location = app/migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# Any required deps can installed by adding `alembic[tz]` to the pip requirements
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# max_length = 40

# version_num separator; default is "_" (underscore)
# version_separator = .

# path toStamp file containing the version number
# of the most recently generated revision for this scipt location
# version_path_separator = os  (default)
# version_path_separator = /
# version_path_separator = \

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# if this is set and is a string which can be interpreted as a boolean,
# the given value will be used as the name of an environment variable
# which can be used to override the value of compare_server_default
# compare_server_default = false

# if this is set to 'true', the 'revision' command will accept a space-separated
# list of multiple revision identifiers as the value of the 'up_revision'
# parameter
# multiple_heads = false

# if this is set to 'true', the 'upgrade' and 'downgrade' commands will
# accept the 'dest' argument, using it as the upper or lower bound
# for the migration to run to
# destination_scenarios = false

# if this is set to 'true', the 'upgrade' and 'downgrade' commands will
# ignore the 'dest' argument, running through all available migrations
# ignore_destination_scenarios = false

# if this is set to 'true', the version number will not be padded with zeros.
# version_num_pad = false

# set to 'true' to use .slug. instead of _slug_ in the default file_template
# see the file_template docs above for more info on this
# slug_prepend = false

# set to 'true' to indicate that the script location should be considered
# a package, not a directory. this is necessary if using .py files for
# migration files and also using a package instead of a directory for
# the script_location.
# package = false

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# Any required deps can installed by adding `alembic[tz]` to the pip requirements
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to include symbolic links when scanning for migration files
# include_symbol_links = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s